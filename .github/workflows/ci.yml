name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.15.22"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install pytest pytest-django pytest-cov pytest-mock factory-boy
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short --color=yes
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests

  test-postgres:
    name: Test (Python 3.12, Django 6.1, PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          POSTGRES_DB: tree_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=6.1.0"
          pip install pytest pytest-django pytest-cov pytest-mock factory-boy "psycopg[binary]"
          pip install -e .

      - name: Run full suite against PostgreSQL
        run: pytest tests/ -v --tb=short --color=yes
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: tree_test
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          ICV_TREE_ENABLE_CTE: "1"

      - name: Run the CTE rebuild suite and capture its result
        run: pytest tests/test_rebuild_cte.py -q -rs --color=no | tee cte.log
        env:
          DJANGO_SETTINGS_MODULE: settings
          PYTHONPATH: src:tests
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: tree_test
          POSTGRES_USER: icv_test
          POSTGRES_PASSWORD: icv_test_password
          ICV_TREE_ENABLE_CTE: "1"

      - name: Guard against a vacuous pass (zero collected or any skip)
        run: |
          if ! grep -qE "(^|[^0-9])[0-9]+ passed" cte.log; then
            echo "No 'N passed' summary line found in cte.log; the CTE suite did not run to completion." >&2
            exit 1
          fi
          if [ "$(grep -c SKIPPED cte.log)" -ne 0 ]; then
            echo "tests/test_rebuild_cte.py reported SKIPPED tests on the Postgres leg; the vendor guard is not lifting as expected." >&2
            exit 1
          fi
